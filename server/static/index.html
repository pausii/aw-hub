<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<title>AW Hub</title>
<script>
  try { const t = localStorage.getItem("awhub-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
        if (localStorage.getItem("awhub-lang") === "id") document.documentElement.lang = "id"; } catch (e) {}
</script>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11,11,11,0.10);
  --wash: rgba(11,11,11,0.05);
  --good: #006300;
  --bad: #b3261e;
  /* perangkat: satu hue (biru), dibedakan terang-gelap */
  --dev-1: #256abf; --dev-2: #86b6ef; --dev-3: #104281; --dev-4: #b7d3f6;
  /* kategori: slot palet tetap */
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
  --s-none: #b5b3ab;
  /* heatmap: satu hue (biru), makin gelap = makin aktif; q0 = tidak ada data */
  --q0: #f0efec; --q1: #cde2fb; --q2: #9ec5f4; --q3: #5598e7; --q4: #256abf; --q5: #104281;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --wash: rgba(255,255,255,0.06);
    --good: #0ca30c; --bad: #e66767;
    --dev-1: #3987e5; --dev-2: #9ec5f4; --dev-3: #1c5cab; --dev-4: #cde2fb;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767; --s-none: #5f5e59;
    --q0: #232322; --q1: #173a66; --q2: #1c5cab; --q3: #2a78d6; --q4: #5598e7; --q5: #9ec5f4;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --wash: rgba(255,255,255,0.06);
  --good: #0ca30c; --bad: #e66767;
  --dev-1: #3987e5; --dev-2: #9ec5f4; --dev-3: #1c5cab; --dev-4: #cde2fb;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767; --s-none: #5f5e59;
    --q0: #232322; --q1: #173a66; --q2: #1c5cab; --q3: #2a78d6; --q4: #5598e7; --q5: #9ec5f4;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--page); color: var(--ink);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
}
.wrap { max-width: 1200px; margin: 0 auto; padding: 20px 16px 48px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; margin-bottom: 16px; }
h1 { font-size: 20px; margin: 0; font-weight: 650; }
h2 { font-size: 14px; font-weight: 600; margin: 0; }
.sub { color: var(--ink-2); font-size: 13px; }
.sync { display: flex; flex-wrap: wrap; gap: 12px; margin-left: auto; color: var(--ink-2); font-size: 12px; }
.sync b { color: var(--ink); font-weight: 600; }
.head-actions { display: flex; gap: 6px; }
.icon-btn {
  display: inline-flex; align-items: center; gap: 6px; font: inherit; font-size: 12px; color: var(--ink-2);
  background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 4px 11px 4px 9px; cursor: pointer;
}
.icon-btn:hover { background: var(--wash); color: var(--ink); }
.icon-btn svg { width: 14px; height: 14px; }
.wk-tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
@media (max-width: 900px) { .wk-tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.wk-tile { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
.wk-tile .label { color: var(--ink-2); font-size: 12px; display: flex; align-items: center; gap: 6px; }
.wk-tile .value { font-size: 20px; font-weight: 600; margin-top: 2px; }
.wk-tile .note { color: var(--muted); font-size: 12px; }
.wk-body { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 900px) { .wk-body { grid-template-columns: minmax(0, 1fr); } }
.wk-foot { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-top: 14px; padding-top: 12px;
  border-top: 1px solid var(--grid); font-size: 12px; color: var(--muted); }
.wk-foot .spacer { flex: 1; }
.split-bar { display: flex; height: 10px; border-radius: 3px; overflow: hidden; gap: 2px; margin: 4px 0 2px; }
.split-bar i { display: block; height: 100%; }
.search { position: relative; display: inline-flex; align-items: center; }
.search svg { position: absolute; left: 9px; width: 14px; height: 14px; color: var(--muted); pointer-events: none; }
.search input {
  font: inherit; font-size: 13px; color: var(--ink); background: var(--surface); width: 220px; max-width: 60vw;
  border: 1px solid var(--border); border-radius: 8px; padding: 5px 10px 5px 29px;
}
.search input:focus { outline: 2px solid var(--dev-2); outline-offset: 0; }
.fchip {
  display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink); background: var(--wash);
  border: 1px solid var(--border); border-radius: 999px; padding: 3px 4px 3px 10px;
}
.fchip b { font-weight: 600; }
.fchip button { border: 0; background: transparent; color: var(--ink-2); cursor: pointer; border-radius: 999px;
  width: 20px; height: 20px; line-height: 1; font-size: 14px; }
.fchip button:hover { background: var(--border); color: var(--ink); }
.clickable { cursor: pointer; }
tr.clickable:hover td, .bar-row.clickable:hover { background: var(--wash); }
tr.is-active td { background: var(--wash); }
.bar-row.is-active .name { font-weight: 600; }
.rh-tiles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
@media (max-width: 900px) { .rh-tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
dialog#catDialog {
  width: min(920px, calc(100vw - 32px)); max-height: calc(100vh - 32px); padding: 0; border: 1px solid var(--border);
  border-radius: 12px; background: var(--surface); color: var(--ink); box-shadow: 0 20px 60px rgba(0,0,0,.3);
}
dialog#catDialog::backdrop { background: rgba(0,0,0,.45); }
.ed-head, .ed-foot { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--grid); }
.ed-foot { border-bottom: 0; border-top: 1px solid var(--grid); position: sticky; bottom: 0; background: var(--surface); }
.ed-head h2 { font-size: 16px; }
.ed-body { padding: 16px 18px; overflow: auto; max-height: calc(100vh - 170px); }
.ed-badge { font-size: 11px; color: var(--ink-2); border: 1px solid var(--border); border-radius: 999px; padding: 2px 8px; }
.ed-help { color: var(--muted); font-size: 12px; margin: 0 0 12px; }
.ed-sec { margin: 22px 0 10px; font-size: 13px; font-weight: 600; }
.ed-rule { display: grid; grid-template-columns: auto minmax(0, 1fr) minmax(0, 1fr) auto auto; gap: 8px 10px; align-items: center;
  border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
.ed-rule textarea { grid-column: 2 / -1; }
.ed-rule .ord { display: flex; flex-direction: column; gap: 2px; grid-row: span 2; }
.ed-rule .ord button, .ed-x { border: 1px solid var(--border); background: transparent; color: var(--ink-2); border-radius: 6px;
  cursor: pointer; font-size: 11px; padding: 1px 6px; }
.ed-x:hover, .ed-rule .ord button:hover { background: var(--wash); color: var(--ink); }
.ed-rule input, .ed-rule select, .ed-rule textarea, .ed-work select {
  font: inherit; font-size: 13px; color: var(--ink); background: var(--page); border: 1px solid var(--border);
  border-radius: 6px; padding: 5px 8px; min-width: 0; width: 100%;
}
.ed-rule textarea { font: 12px/1.4 ui-monospace, Consolas, monospace; min-height: 38px; resize: vertical; }
.ed-slots { display: flex; gap: 4px; }
.ed-slots label { width: 18px; height: 18px; border-radius: 5px; cursor: pointer; display: block; position: relative; }
.ed-slots input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.ed-slots input:checked + i { position: absolute; inset: -3px; border: 2px solid var(--ink); border-radius: 7px; }
.ed-slots input:focus-visible + i { position: absolute; inset: -3px; border: 2px dashed var(--ink); border-radius: 7px; }
.ed-work { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 10px 14px; align-items: center; font-size: 13px; }
.ed-checks { display: flex; flex-wrap: wrap; gap: 6px; }
.ed-checks label { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--border); border-radius: 999px;
  padding: 3px 10px; cursor: pointer; font-size: 12px; }
.ed-checks label:has(input:checked) { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.ed-checks input { margin: 0; }
.ed-test { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 10px; }
@media (max-width: 700px) { .ed-test { grid-template-columns: minmax(0, 1fr); } .ed-rule { grid-template-columns: auto minmax(0, 1fr); }
  .ed-rule textarea { grid-column: 1 / -1; } .ed-work { grid-template-columns: minmax(0, 1fr); } }
.ed-test table td { vertical-align: middle; }
.ed-test select { font: inherit; font-size: 12px; color: var(--ink); background: var(--page); border: 1px solid var(--border); border-radius: 6px; padding: 2px 4px; max-width: 130px; }
.ed-err { color: var(--bad); font-size: 13px; }
.btn.primary { background: var(--ink); color: var(--surface); border-color: var(--ink); }
#reportPreview { white-space: pre-wrap; font: 12px/1.5 ui-monospace, Consolas, monospace; background: var(--wash);
  border-radius: 8px; padding: 12px; margin-top: 12px; max-height: 420px; overflow: auto; }

.filters {
  display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center;
  padding: 10px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  margin-bottom: 16px; position: sticky; top: 0; z-index: 5;
}
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; flex-wrap: wrap; }
.seg button {
  border: 0; background: transparent; color: var(--ink-2); font: inherit; font-size: 13px;
  padding: 5px 10px; cursor: pointer;
}
.seg button + button { border-left: 1px solid var(--border); }
.seg button:hover { background: var(--wash); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.range { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); font-size: 13px; }
input[type=date] {
  font: inherit; font-size: 13px; color: var(--ink); background: var(--surface);
  border: 1px solid var(--border); border-radius: 6px; padding: 4px 6px;
}
.chip {
  display: inline-flex; align-items: center; gap: 6px; font: inherit; font-size: 13px;
  border: 1px solid var(--border); background: transparent; color: var(--ink); border-radius: 999px;
  padding: 4px 10px; cursor: pointer;
}
.chip[aria-pressed="false"] { color: var(--muted); }
.chip[aria-pressed="false"] .sw { opacity: .25; }
.sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
.spacer { flex: 1; }

.grid { display: grid; gap: 16px; grid-template-columns: repeat(12, minmax(0, 1fr)); }
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px;
  min-width: 0;
}
.card-h { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.card-h .sub { font-size: 12px; }
.card-h .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.c12 { grid-column: span 12; } .c8 { grid-column: span 8; } .c6 { grid-column: span 6; } .c4 { grid-column: span 4; }
@media (max-width: 900px) { .c8, .c6, .c4 { grid-column: span 12; } }

.kpis { display: grid; grid-template-columns: minmax(0, 1.4fr) repeat(3, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 900px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) {
  .kpis { grid-template-columns: minmax(0, 1fr); }
  .kpi.hero .value { font-size: 40px; }
  .card-h .right { margin-left: 0; }
  .bar-row { grid-template-columns: minmax(80px, 110px) 1fr 96px; }
}
.kpi .label { color: var(--ink-2); font-size: 13px; }
.kpi .value { font-size: 26px; font-weight: 600; margin-top: 2px; }
.kpi.hero .value { font-size: 48px; line-height: 1.1; }
.kpi .delta { font-size: 13px; color: var(--ink-2); margin-top: 4px; }
.kpi .delta .up, .kpi .delta .down { color: var(--ink); font-weight: 600; }
.split { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; font-size: 13px; color: var(--ink-2); }
.split span { display: inline-flex; align-items: center; gap: 6px; }
.split b { color: var(--ink); font-weight: 600; margin-left: auto; font-variant-numeric: tabular-nums; }

.seg.sm button { font-size: 12px; padding: 3px 9px; }
.donut-wrap { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
.donut-wrap #categories { flex: 1; min-width: 220px; }
.kpi.hero { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 12px; }
.kpi.hero .label, .kpi.hero .delta { grid-column: 1 / -1; }
.kpi.hero .spark { align-self: end; margin-bottom: 8px; }
.kpi.hero .value { white-space: nowrap; }
@media (max-width: 900px) { .kpi.hero .spark { display: none; } }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-2); margin-top: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }

svg { display: block; overflow: visible; }
svg text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
svg .val { fill: var(--ink-2); font-size: 11px; }

.bars { display: flex; flex-direction: column; gap: 8px; }
.bar-row { display: grid; grid-template-columns: minmax(90px, 150px) 1fr 104px; gap: 10px; align-items: center; font-size: 13px; }
.bar-row .name { display: flex; align-items: center; gap: 6px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.bar-row .track { height: 12px; }
.bar-row .fill { height: 12px; border-radius: 0 4px 4px 0; min-width: 2px; }
.bar-row .num { white-space: nowrap; text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-2); }

table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; padding: 4px 6px; border-bottom: 1px solid var(--grid); }
td { padding: 6px; border-bottom: 1px solid var(--grid); vertical-align: top; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td .t { overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-word; }
td .m { color: var(--muted); font-size: 12px; }
.inbar { height: 4px; border-radius: 2px; background: var(--ink-2); opacity: .35; margin-top: 4px; }
tr:last-child td { border-bottom: 0; }

.btn {
  font: inherit; font-size: 13px; border: 1px solid var(--border); background: transparent; color: var(--ink);
  border-radius: 6px; padding: 3px 9px; cursor: pointer;
}
.btn:hover { background: var(--wash); }
.link { font-size: 12px; color: var(--ink-2); background: none; border: 0; cursor: pointer; text-decoration: underline; padding: 0; font-family: inherit; }

#tip {
  position: fixed; pointer-events: none; z-index: 20; max-width: 340px;
  background: var(--surface); color: var(--ink); border: 1px solid var(--border);
  box-shadow: 0 4px 16px rgba(0,0,0,.12); border-radius: 8px; padding: 8px 10px; font-size: 12px;
  opacity: 0; transition: opacity .08s;
}
#tip .tt { font-weight: 600; margin-bottom: 4px; }
#tip .row { display: flex; gap: 12px; align-items: center; }
#tip .row b { margin-left: auto; font-weight: 600; font-variant-numeric: tabular-nums; }
#tip .mt { color: var(--ink-2); word-break: break-word; }
.empty { color: var(--muted); font-size: 13px; padding: 24px 0; text-align: center; }
.err { color: var(--bad); padding: 12px; }
.hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>AW Hub</h1>
    <span class="sub" id="rangeLabel"></span>
    <div class="sync" id="sync"></div>
    <div class="head-actions">
      <button class="icon-btn" id="langBtn" type="button" data-i18n-title="lang.title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg><span id="langLabel"></span>
      </button>
      <button class="icon-btn" id="themeBtn" type="button" data-i18n-aria="theme.title"></button>
      <button class="icon-btn" id="logoutBtn" type="button" data-i18n-title="logout">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg><span data-i18n="logout"></span>
      </button>
    </div>
  </header>

  <div class="filters" role="toolbar" data-i18n-aria="filter">
    <div class="seg" id="presets"></div>
    <div class="range">
      <input type="date" id="from" data-i18n-aria="fromDate"> –
      <input type="date" id="to" data-i18n-aria="toDate">
    </div>
    <div class="seg" id="group" data-i18n-aria="groupBy"></div>
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" id="search" maxlength="200" data-i18n-ph="search.ph" data-i18n-aria="search.ph">
    </label>
    <span id="filterChip"></span>
    <div class="spacer"></div>
    <div id="devChips" style="display:flex;gap:6px;flex-wrap:wrap"></div>
  </div>

  <div id="error" class="err hidden"></div>

  <div class="grid">
    <div class="c12 kpis" id="kpis"></div>

    <section class="card c12">
      <div class="card-h">
        <h2 data-i18n="active.title"></h2><span class="sub" id="seriesSub"></span>
        <div class="right">
          <div class="seg sm" data-mode="seriesMode" data-i18n-aria="chart.form">
            <button data-v="line" data-i18n="line"></button><button data-v="bar" data-i18n="bar"></button>
          </div>
          <button class="link" id="seriesToggle" data-i18n="viewTable"></button>
        </div>
      </div>
      <div id="seriesChart"></div>
      <div id="seriesTable" class="hidden"></div>
      <div class="legend" id="seriesLegend"></div>
    </section>

    <section class="card c12">
      <div class="card-h">
        <h2 data-i18n="timeline.title"></h2><span class="sub" id="tlSub"></span>
        <div class="right">
          <button class="btn" id="tlPrev" data-i18n-aria="prevDay">‹</button>
          <input type="date" id="tlDay" data-i18n-aria="tlDate">
          <button class="btn" id="tlNext" data-i18n-aria="nextDay">›</button>
        </div>
      </div>
      <div id="timeline"></div>
      <div class="legend" id="catLegend"></div>
    </section>

    <section class="card c12">
      <div class="card-h"><h2 data-i18n="rh.title"></h2><span class="sub" data-i18n="rh.sub"></span></div>
      <div class="rh-tiles" id="rhTiles"></div>
      <div id="rhChart"></div>
    </section>

    <section class="card c6">
      <div class="card-h"><h2 data-i18n="cat.title"></h2><span class="sub" data-i18n="cat.sub"></span>
        <div class="right"><button class="btn" id="catEditBtn" type="button" data-i18n="cat.edit"></button></div></div>
      <div class="donut-wrap">
        <div id="catDonut"></div>
        <div id="categories" class="bars"></div>
      </div>
    </section>

    <section class="card c6">

function t(key, vars) {
  let str = I18N[LANG][key] ?? I18N.en[key] ?? key;
  if (vars) for (const k in vars) str = str.split(`{${k}}`).join(vars[k]);
  return str;
}
const pad2 = (n) => String(n).padStart(2, "0");

}

// ---------- util tanggal (string YYYY-MM-DD, aritmetika di UTC agar bebas zona waktu browser)
const toD = (s) => new Date(s + "T00:00:00Z");
const toS = (d) => d.toISOString().slice(0, 10);
const addDays = (s, n) => { const d = toD(s); d.setUTCDate(d.getUTCDate() + n); return toS(d); };
const diffDays = (a, b) => Math.round((toD(b) - toD(a)) / 864e5);
function presetRange(p, today) {
  const d = toD(today);
  switch (p) {
    case "today": return [today, today];
    case "yesterday": return [addDays(today, -1), addDays(today, -1)];
    case "week": return [addDays(today, -((d.getUTCDay() + 6) % 7)), today];
    case "7d": return [addDays(today, -6), today];
    case "30d": return [addDays(today, -29), today];
    case "90d": return [addDays(today, -89), today];
    case "month": return [today.slice(0, 8) + "01", today];
    case "lastmonth": {
      const first = today.slice(0, 8) + "01", end = addDays(first, -1);
      return [end.slice(0, 8) + "01", end];
    }
  }
}
function autoGroup(from, to) {
  const n = diffDays(from, to) + 1;
  return n > 120 ? "month" : n > 45 ? "week" : "day";
}
function fmtDate(s, withYear) {
  const d = toD(s);
  return `${L().days[d.getUTCDay()]}, ${d.getUTCDate()} ${L().months[d.getUTCMonth()]}${withYear ? " " + d.getUTCFullYear() : ""}`;
}
function periodLabel(k, group, short) {
  const d = toD(k);
  if (group === "month") return `${L().months[d.getUTCMonth()]}${short ? "" : " " + d.getUTCFullYear()}`;
  if (group === "week") return `${short ? "" : t("weekOf")}${d.getUTCDate()} ${L().months[d.getUTCMonth()]}`;
  return short ? `${d.getUTCDate()}/${d.getUTCMonth() + 1}` : fmtDate(k);
}
function fmtDur(sec) {
  sec = Math.round(sec || 0);
  if (sec < 60) return sec > 0 ? "<1m" : "0m";
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60);
  return h ? `${h}${L().h} ${String(m).padStart(2, "0")}m` : `${m}m`;
}
const fmtClock = (ts) => new Date(ts * 1000).toLocaleTimeString(L().locale, { hour: "2-digit", minute: "2-digit", timeZone: S.tz });
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const cssVar = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

// warna mengikuti entitas, bukan peringkat: perangkat diurutkan nama, kategori via slot
const devColor = (name) => `var(--dev-${(S.devices.findIndex((d) => d.name === name) % 4) + 1})`;
function catColor(name) {
  const c = S.cats.find((x) => x.name === name);
  if (c && c.color) return c.color;
  return c && c.slot ? `var(--s${c.slot})` : "var(--s-none)";
}
const visibleDevices = () => S.devices.map((d) => d.name).filter((n) => !S.hidden.has(n));

// ---------- tooltip
const tip = $("#tip");
function showTip(ev, html) {
  tip.innerHTML = html; tip.style.opacity = 1;
  const r = tip.getBoundingClientRect(), pad = 14;
  let x = ev.clientX + pad, y = ev.clientY + pad;
  if (x + r.width > innerWidth - 8) x = ev.clientX - r.width - pad;
  if (y + r.height > innerHeight - 8) y = ev.clientY - r.height - pad;
  tip.style.left = Math.max(8, x) + "px"; tip.style.top = Math.max(8, y) + "px";
}
const hideTip = () => { tip.style.opacity = 0; };
const tipRow = (sw, label, val) => `<div class="row"><span class="sw" style="background:${sw}"></span>${esc(label)}<b>${val}</b></div>`;

// ---------- API
async function api(path) {
  // origin, bukan URL relatif: URL berkredensial (user:pass@host) ditolak fetch
  const r = await fetch(location.origin + path, { credentials: "same-origin" });
  if (r.status === 401) { location.href = "/login?next=" + encodeURIComponent("/" + location.hash); throw new Error(t("sessionEnded")); }
  if (!r.ok) throw new Error(`${path}: HTTP ${r.status}`);
  return r.json();
}

// ---------- state <-> URL hash
function readHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.get("from") && p.get("to")) { S.from = p.get("from"); S.to = p.get("to"); S.preset = p.get("preset") || null; }
  if (p.get("group")) S.group = p.get("group");
  if (p.get("hide")) S.hidden = new Set(p.get("hide").split(","));
  if (p.get("day")) S.tlDay = p.get("day");
  if (p.get("sm") === "bar") S.seriesMode = "bar";
  if (p.get("hm") === "bar") S.hourMode = "bar";
  S.flt = { category: p.get("fcat") || null, app: p.get("fapp") || null, q: p.get("q") || "" };
}
function writeHash() {
  const p = new URLSearchParams({ from: S.from, to: S.to, group: S.group });
  if (S.preset) p.set("preset", S.preset);
  if (S.hidden.size) p.set("hide", [...S.hidden].join(","));
  if (S.tlDay) p.set("day", S.tlDay);
  if (S.seriesMode !== "line") p.set("sm", S.seriesMode);
  if (S.hourMode !== "heat") p.set("hm", S.hourMode);
  if (S.flt.category) p.set("fcat", S.flt.category);
  if (S.flt.app) p.set("fapp", S.flt.app);
  if (S.flt.q) p.set("q", S.flt.q);
  history.replaceState(null, "", "#" + p);
}

// ---------- skala & sumbu bersama
function niceStep(maxH) {
  for (const s of [0.25, 0.5, 1, 2, 4, 5, 10, 20, 25, 50, 100, 200, 250, 500]) if (maxH / s <= 5) return s;
  return 1000;
}
function roundedTop(x, y, w, h, r) {
  r = Math.min(r, h, w / 2);
  return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
}
// kerangka chart berbasis periode: sumbu Y (jam) + label X; posisi titik = tengah band
function frame(el, rows, maxSec, { labelFn, height }) {
  const W = Math.max(280, el.clientWidth), H = height, m = { l: 34, r: 8, t: 10, b: 24 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const maxH = Math.max(1 / 60, maxSec / 3600);
  const step = niceStep(maxH), top = Math.ceil(maxH / step) * step;
  const band = iw / Math.max(1, rows.length);
  const f = {
    W, H, m, iw, ih, band,
    y: (sec) => m.t + ih - (sec / 3600 / top) * ih,
    cx: (i) => m.l + band * i + band / 2,
    grid: "",
  };
  for (let v = 0; v <= top + 1e-9; v += step) {
    f.grid += `<line x1="${m.l}" x2="${W - m.r}" y1="${f.y(v * 3600)}" y2="${f.y(v * 3600)}" stroke="var(${v ? "--grid" : "--axis"})"/>`;
    f.grid += `<text x="${m.l - 6}" y="${f.y(v * 3600) + 4}" text-anchor="end">${+v.toFixed(2)}${L().h}</text>`;
  }
  const every = Math.ceil(rows.length / Math.max(1, Math.floor(iw / 46)));
  rows.forEach((r, i) => {
    if (i % every === 0) f.grid += `<text x="${f.cx(i)}" y="${H - 6}" text-anchor="middle">${esc(labelFn(r, true))}</text>`;
  });
  return f;
}
// tooltip satu-untuk-semua-seri pada satu periode
function seriesTip(ev, title, keys, colorFn, vals, showTotal, nameFn = (k) => k) {
  const rows = keys.filter((k) => vals[k]).map((k) => tipRow(colorFn(k), nameFn(k), fmtDur(vals[k])));
  const total = keys.reduce((a, k) => a + (vals[k] || 0), 0);
  showTip(ev, `<div class="tt">${esc(title)}</div>${rows.join("") || `<div class="mt">${t("noActivity")}</div>`}` +
    (showTotal && rows.length > 1 ? `<div class="row" style="margin-top:4px">${t("total")}<b>${fmtDur(total)}</b></div>` : ""));
}

// ---------- kolom bertumpuk
function stackedColumns(el, rows, { keys, colorFn, valFn, labelFn, tipTitle, height = 220, nameFn }) {
  const totals = rows.map((r) => keys.reduce((a, k) => a + (valFn(r, k) || 0), 0));
  const f = frame(el, rows, Math.max(...totals, 0), { labelFn, height });
  const bw = Math.min(24, Math.max(2, f.band * 0.7)), GAP = 2;
  let marks = "", hits = "";
  rows.forEach((r, i) => {
    const x = f.cx(i) - bw / 2;
    let acc = 0;
    const present = keys.filter((k) => (valFn(r, k) || 0) > 0);
    present.forEach((k, j) => {
      const yBot = f.y(acc) - (j ? GAP : 0), yTop = f.y((acc += valFn(r, k)));
      const hh = yBot - yTop;
      if (hh <= 0) return;
      marks += j === present.length - 1
        ? `<path d="${roundedTop(x, yTop, bw, hh, 4)}" fill="${colorFn(k)}"/>`
        : `<rect x="${x}" y="${yTop}" width="${bw}" height="${hh}" fill="${colorFn(k)}"/>`;
    });
    hits += `<rect class="hit" data-i="${i}" x="${f.m.l + f.band * i}" y="${f.m.t}" width="${f.band}" height="${f.ih}" fill="transparent"/>`;
  });
  el.innerHTML = `<svg width="${f.W}" height="${f.H}" role="img">${f.grid}${marks}${hits}</svg>`;
  el.querySelectorAll(".hit").forEach((h) => {
    const r = rows[+h.dataset.i];
    h.addEventListener("mousemove", (ev) => {
      h.setAttribute("fill", "var(--wash)");
      seriesTip(ev, tipTitle(r), keys, colorFn, Object.fromEntries(keys.map((k) => [k, valFn(r, k)])), true, nameFn);
    });
    h.addEventListener("mouseleave", () => { h.setAttribute("fill", "transparent"); hideTip(); });
  });
}

// crosshair bersama untuk garis & area: snap ke periode terdekat
function attachCrosshair(el, f, rows, onMove) {
  const svg = el.querySelector("svg"), cross = svg.querySelector(".cross");
  svg.addEventListener("mousemove", (ev) => {
    const px = ev.clientX - svg.getBoundingClientRect().left;
    const i = Math.max(0, Math.min(rows.length - 1, Math.round((px - f.m.l - f.band / 2) / f.band)));
    cross.setAttribute("x1", f.cx(i)); cross.setAttribute("x2", f.cx(i)); cross.style.opacity = 1;
    onMove(ev, i);
  });
  svg.addEventListener("mouseleave", () => { cross.style.opacity = 0; onMove(null, -1); hideTip(); });
}

// ---------- garis (tren per perangkat + total)
function lineChart(el, rows, { keys, colorFn, valFn, labelFn, tipTitle, height = 220, totalKey }) {
  const series = keys.map((k) => ({ k, color: colorFn(k), vals: rows.map((r) => valFn(r, k) || 0) }));
  if (totalKey) {
    series.push({ k: totalKey, color: "var(--ink-2)",
                  vals: rows.map((_, i) => series.reduce((a, s) => a + s.vals[i], 0)) });
  }
  const f = frame(el, rows, Math.max(0, ...series.flatMap((s) => s.vals)), { labelFn, height });
  const pts = (s) => s.vals.map((v, i) => `${f.cx(i)},${f.y(v)}`).join(" ");
  const last = rows.length - 1;
  let marks = "";
  // area wash hanya untuk seri tunggal (banyak wash bertumpuk jadi keruh)
  if (series.length === 1 && rows.length > 1) {
    marks += `<polygon points="${f.cx(0)},${f.y(0)} ${pts(series[0])} ${f.cx(last)},${f.y(0)}" fill="${series[0].color}" opacity=".10"/>`;
  }
  for (const s of series) {
    marks += `<polyline points="${pts(s)}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    marks += `<circle cx="${f.cx(last)}" cy="${f.y(s.vals[last])}" r="4" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`;
  }
  const dots = series.map((s, j) =>
    `<circle class="hd" data-j="${j}" r="4.5" fill="${s.color}" stroke="var(--surface)" stroke-width="2" style="opacity:0"/>`).join("");
  el.innerHTML = `<svg width="${f.W}" height="${f.H}" role="img">${f.grid}
    <line class="cross" y1="${f.m.t}" y2="${f.m.t + f.ih}" stroke="var(--axis)" style="opacity:0"/>${marks}${dots}
    <rect x="${f.m.l}" y="${f.m.t}" width="${f.iw}" height="${f.ih}" fill="transparent"/></svg>`;
  const hd = el.querySelectorAll(".hd");
  const allKeys = series.map((s) => s.k), colorOf = Object.fromEntries(series.map((s) => [s.k, s.color]));
  attachCrosshair(el, f, rows, (ev, i) => {
    hd.forEach((c) => {
      if (i < 0) { c.style.opacity = 0; return; }
      const s = series[+c.dataset.j];
      c.setAttribute("cx", f.cx(i)); c.setAttribute("cy", f.y(s.vals[i])); c.style.opacity = 1;
    });
    if (i >= 0) seriesTip(ev, tipTitle(rows[i]), allKeys, (k) => colorOf[k],
                          Object.fromEntries(series.map((s) => [s.k, s.vals[i]])), false);
  });
}

// ---------- area bertumpuk (komposisi kategori per periode)
function stackedArea(el, rows, { keys, colorFn, valFn, labelFn, tipTitle, height = 220, nameFn }) {
  if (rows.length < 2) return stackedColumns(el, rows, { keys, colorFn, valFn, labelFn, tipTitle, height, nameFn });
  const cum = rows.map(() => 0), layers = [];
  for (const k of keys) {
    const lo = cum.slice();
    rows.forEach((r, i) => (cum[i] += valFn(r, k) || 0));
    layers.push({ k, lo, hi: cum.slice() });
  }
  const f = frame(el, rows, Math.max(0, ...cum), { labelFn, height });
  let marks = "";
  for (const L of layers) {
    const up = L.hi.map((v, i) => `${f.cx(i)},${f.y(v)}`);
    const down = L.lo.map((v, i) => `${f.cx(i)},${f.y(v)}`).reverse();
    // tepi berwarna surface = celah antar lapisan (bukan border)
    marks += `<polygon points="${up.join(" ")} ${down.join(" ")}" fill="${colorFn(L.k)}" stroke="var(--surface)" stroke-width="1.5" stroke-linejoin="round"/>`;
  }
  el.innerHTML = `<svg width="${f.W}" height="${f.H}" role="img">${f.grid}${marks}
    <line class="cross" y1="${f.m.t}" y2="${f.m.t + f.ih}" stroke="var(--ink-2)" style="opacity:0"/>
    <rect x="${f.m.l}" y="${f.m.t}" width="${f.iw}" height="${f.ih}" fill="transparent"/></svg>`;
  attachCrosshair(el, f, rows, (ev, i) => {
    if (i < 0) return;
    const r = rows[i], sorted = keys.slice().sort((a, b) => (valFn(r, b) || 0) - (valFn(r, a) || 0));
    seriesTip(ev, tipTitle(r), sorted, colorFn, Object.fromEntries(keys.map((k) => [k, valFn(r, k)])), true, nameFn);
  });
}

// ---------- donut (bagian dari total, maks 6 segmen)
function donut(el, items, total) {
  const MAX = 6;
  let segs = items.filter((c) => c.sec > 0);
  if (segs.length > MAX) {
    const rest = segs.slice(MAX - 1);
    segs = [...segs.slice(0, MAX - 1), { name: "__other__", sec: rest.reduce((a, c) => a + c.sec, 0),
                                         members: rest.map((c) => c.name), color: "var(--s-none)" }];
  }
  const D = 168, R = 64, SW = 22, C = 2 * Math.PI * R, GAP = segs.length > 1 ? 2 : 0;
  let off = 0, arcs = "";
  segs.forEach((c, i) => {
    const len = (c.sec / total) * C, draw = Math.max(0.5, len - GAP);
    arcs += `<circle class="arc" data-i="${i}" cx="${D / 2}" cy="${D / 2}" r="${R}" fill="none" stroke="${c.color || catColor(c.name)}"
      stroke-width="${SW}" stroke-dasharray="${draw} ${C - draw}" stroke-dashoffset="${-off}"
      transform="rotate(-90 ${D / 2} ${D / 2})"/>`;
    off += len;
  });
  el.innerHTML = `<svg width="${D}" height="${D}" role="img" aria-label="${t("cat.title")}">${arcs}
    <text x="${D / 2}" y="${D / 2 - 2}" text-anchor="middle" style="fill:var(--ink);font-size:18px;font-weight:600">${fmtDur(total)}</text>
    <text x="${D / 2}" y="${D / 2 + 16}" text-anchor="middle">${t("active")}</text></svg>`;
  el.querySelectorAll(".arc").forEach((a) => {
    const c = segs[+a.dataset.i];
    a.addEventListener("mousemove", (ev) => {
      a.setAttribute("stroke-width", SW + 4);
      showTip(ev, tipRow(c.color || catColor(c.name), catLabel(c.name), `${fmtDur(c.sec)} · ${Math.round((c.sec / total) * 100)}%`) +
        (c.members ? `<div class="mt" style="margin-top:4px">${esc(c.members.map(catLabel).join(", "))}</div>` : ""));
    });
    a.addEventListener("mouseleave", () => { a.setAttribute("stroke-width", SW); hideTip(); });
  });
}

// ---------- heatmap hari × jam (rata-rata menit aktif per jam)
const HEAT_BINS = [5, 15, 30, 45]; // menit: <5 → q1, 5–15 → q2, ..., ≥45 → q5
function heatmap(el, heat) {
  const order = [...Array(24).keys()].map((h) => (S.dayStartHour + h) % 24);
  const W = Math.max(280, el.clientWidth), m = { l: 34, r: 4, t: 4, b: 22 }, gap = 2;
  const cw = (W - m.l - m.r) / 24, ch = Math.min(26, Math.max(16, cw * 0.9)), H = m.t + 7 * ch + m.b;
  const NAMES = L().wkShort, FULL = L().wkFull;
  let g = "", cells = "";
  NAMES.forEach((n, wd) => { g += `<text x="${m.l - 6}" y="${m.t + wd * ch + ch / 2 + 4}" text-anchor="end">${n}</text>`; });
  order.forEach((h, j) => {
    if (j % (cw < 22 ? 3 : 2) === 0) g += `<text x="${m.l + j * cw + cw / 2}" y="${H - 6}" text-anchor="middle">${String(h).padStart(2, "0")}</text>`;
  });
  for (let wd = 0; wd < 7; wd++) {
    const n = heat.weekday_count[wd];
    order.forEach((h, j) => {
      const avgMin = n ? heat.cells[wd][h] / n / 60 : 0;
      const q = avgMin <= 0 ? 0 : 1 + HEAT_BINS.filter((b) => avgMin >= b).length;
      cells += `<rect class="hc" data-w="${wd}" data-h="${h}" x="${m.l + j * cw + gap / 2}" y="${m.t + wd * ch + gap / 2}"
        width="${cw - gap}" height="${ch - gap}" rx="3" fill="var(--q${q})"/>`;
    });
  }
  el.innerHTML = `<svg width="${W}" height="${H}" role="img" aria-label="${t("hours.subHeat")}">${g}${cells}</svg>`;
  el.querySelectorAll(".hc").forEach((c) => {
    c.addEventListener("mousemove", (ev) => {
      const wd = +c.dataset.w, h = +c.dataset.h, n = heat.weekday_count[wd], sec = heat.cells[wd][h];
      c.setAttribute("stroke", "var(--ink)"); c.setAttribute("stroke-width", "1.5");
      showTip(ev, `<div class="tt">${FULL[wd]} · ${String(h).padStart(2, "0")}:00–${String((h + 1) % 24).padStart(2, "0")}:00</div>
        <div class="row">${t("heat.avg")}<b>${n ? fmtDur(sec / n) : "–"}</b></div>
        <div class="row">${t("heat.total", { n, day: FULL[wd] })}<b>${fmtDur(sec)}</b></div>`);
    });
    c.addEventListener("mouseleave", () => { c.removeAttribute("stroke"); hideTip(); });
  });
}
function heatLegend() {
  const labels = ["0", "<5m", "5–15m", "15–30m", "30–45m", "≥45m"];
  return `<span>${t("heat.legend")}</span>` +
    labels.map((l, q) => `<span><i class="sw" style="background:var(--q${q})"></i>${l}</span>`).join("");
}

// sparkline kecil untuk tile total
function sparkline(vals) {
  if (vals.length < 2) return "";
  const W = 96, H = 32, max = Math.max(...vals, 1);
  const x = (i) => 3 + (i / (vals.length - 1)) * (W - 6), y = (v) => H - 4 - (v / max) * (H - 8);
  const last = vals.length - 1;
  return `<svg class="spark" width="${W}" height="${H}" aria-hidden="true">
    <polyline points="${vals.map((v, i) => `${x(i)},${y(v)}`).join(" ")}" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="${x(last)}" cy="${y(vals[last])}" r="3.5" fill="var(--dev-1)" stroke="var(--surface)" stroke-width="2"/></svg>`;
}

// ---------- render per kartu
const periodOpts = (g) => ({ labelFn: (r, short) => periodLabel(r.period, g, short),
                             tipTitle: (r) => periodLabel(r.period, g, false) });
const devLegend = () => visibleDevices().map((d) => `<span><i class="sw" style="background:${devColor(d)}"></i>${esc(d)}</span>`);

function renderSeries(st) {
  const g = st.range.group, devs = visibleDevices();
  $("#seriesSub").textContent = g === "week" ? t("series.perWeek") : L().per[g];
  const opts = { keys: devs, colorFn: devColor, valFn: (r, k) => r.per_device[k], ...periodOpts(g) };
  if (S.seriesMode === "bar") stackedColumns($("#seriesChart"), st.series, opts);
  else lineChart($("#seriesChart"), st.series, { ...opts, totalKey: devs.length > 1 ? t("total") : null });
  const legend = devLegend();
  if (S.seriesMode !== "bar" && devs.length > 1) legend.push(`<span><i class="sw" style="background:var(--ink-2);height:2px"></i>${t("total")}</span>`);
  $("#seriesLegend").innerHTML = devs.length > 1 ? legend.join("") : "";
  $("#seriesTable").innerHTML = `<table><thead><tr><th>${t("period")}</th>${devs.map((d) => `<th class="n">${esc(d)}</th>`).join("")}<th class="n">${t("total")}</th></tr></thead><tbody>` +
    st.series.map((r) => `<tr><td>${esc(periodLabel(r.period, g, false))}</td>${devs.map((d) => `<td class="n">${fmtDur(r.per_device[d])}</td>`).join("")}<td class="n">${fmtDur(devs.reduce((a, d) => a + (r.per_device[d] || 0), 0))}</td></tr>`).join("") +
    `</tbody></table>`;
}

function renderHours(st) {
  if (S.hourMode === "bar") {
    const s = S.dayStartHour, rows = [...st.hours.slice(s), ...st.hours.slice(0, s)];
    stackedColumns($("#hours"), rows, {
      keys: visibleDevices(), colorFn: devColor, valFn: (r, k) => r.per_device[k], height: 200,
      labelFn: (r) => String(r.hour).padStart(2, "0"),
      tipTitle: (r) => `${String(r.hour).padStart(2, "0")}:00 – ${String((r.hour + 1) % 24).padStart(2, "0")}:00`,
    });
    $("#hoursSub").textContent = t("hours.subBar");
    $("#hoursLegend").innerHTML = visibleDevices().length > 1 ? devLegend().join("") : "";
  } else {
    heatmap($("#hours"), st.heat);
    $("#hoursSub").textContent = t("hours.subHeat");
    $("#hoursLegend").innerHTML = heatLegend();
  }
}

function renderCategories(st) {
  const total = st.total || 1, max = Math.max(1, ...st.categories.map((c) => c.sec));
  if (!st.categories.length) {
    $("#catDonut").innerHTML = "";
    $("#categories").innerHTML = `<div class="empty">${t("noData")}</div>`;
    return;
  }
  donut($("#catDonut"), st.categories, total);
  $("#categories").innerHTML = st.categories.map((c) => `

// ---------- timeline
function renderTimeline() {
  const tl = S.tl, el = $("#timeline"), devs = visibleDevices();
  $("#tlDay").value = S.tlDay; $("#tlDay").max = S.today;
  $("#tlNext").disabled = S.tlDay >= S.today;
  const segs = tl.segments.filter((s) => devs.includes(s.device));
  const byDev = devs.map((d) => segs.filter((s) => s.device === d).reduce((a, s) => a + s.active, 0));
  $("#tlSub").textContent = t("tl.sub", { date: fmtDate(S.tlDay, true), h: pad2(S.dayStartHour), dur: fmtDur(byDev.reduce((a, b) => a + b, 0)) });
  const W = Math.max(280, el.clientWidth), rowH = 26, gapR = 10, m = { l: 90, r: 8, t: 4, b: 22 };
  const H = m.t + devs.length * (rowH + gapR) - gapR + m.b, iw = W - m.l - m.r;
  const span = tl.end - tl.start, x = (ts) => m.l + ((ts - tl.start) / span) * iw;
  let g = "";
  const tickEvery = iw < 500 ? 4 : 2;
  for (let h = 0; h <= 24; h += tickEvery) {
    const xx = m.l + (h / 24) * iw;
    g += `<line x1="${xx}" x2="${xx}" y1="${m.t}" y2="${H - m.b}" stroke="var(--grid)"/>`;
    g += `<text x="${xx}" y="${H - 6}" text-anchor="middle">${String((S.dayStartHour + h) % 24).padStart(2, "0")}</text>`;
  }
  devs.forEach((d, i) => {
    const y0 = m.t + i * (rowH + gapR);
    g += `<rect x="${m.l}" y="${y0}" width="${iw}" height="${rowH}" fill="var(--wash)" rx="4"/>`;
    g += `<text x="${m.l - 8}" y="${y0 + rowH / 2 + 4}" text-anchor="end" style="fill:var(--ink-2);font-size:12px">${esc(d)}</text>`;
  });
  let marks = "";
  segs.forEach((s, k) => {
    const i = devs.indexOf(s.device), y0 = m.t + i * (rowH + gapR);
    const x0 = x(s.start), w = Math.max(1, x(s.end) - x0);
    marks += `<rect class="seg" data-k="${k}" x="${x0}" y="${y0}" width="${w}" height="${rowH}" fill="${catColor(s.category)}"/>`;
  });
  el.innerHTML = segs.length || devs.length
    ? `<svg width="${W}" height="${H}" role="img" aria-label="${t("timeline.title")}">${g}${marks}</svg>` +
      (segs.length ? "" : `<div class="empty">${t("tl.empty")}</div>`)
    : "";
  const svg = el.querySelector("svg");
  // hit target dicari dari posisi kursor agar segmen sangat tipis tetap bisa di-hover
  let hovered = null;   // segmen di bawah kursor → klik = filter aplikasinya
  svg?.addEventListener("mousemove", (ev) => {
    const r = svg.getBoundingClientRect(), px = ev.clientX - r.left, py = ev.clientY - r.top;
    const i = Math.floor((py - m.t) / (rowH + gapR));
    hovered = null; svg.style.cursor = "";
    if (i < 0 || i >= devs.length || py - m.t - i * (rowH + gapR) > rowH) return hideTip();
    let best = null, bestDist = 4;
    for (const s of segs) {
      if (s.device !== devs[i]) continue;
      const a = x(s.start), b = x(s.end), dist = px < a ? a - px : px > b ? px - b : 0;
      if (dist < bestDist || (dist === 0 && bestDist === 0 && b - a < x(best.end) - x(best.start))) { best = s; bestDist = dist; }
    }
    if (!best) return hideTip();
    hovered = best; svg.style.cursor = "pointer";
    showTip(ev, `<div class="tt">${esc(best.app.replace(/\.exe$/i, ""))}</div>
      <div class="mt">${esc(best.title)}</div>
      ${tipRow(catColor(best.category), catLabel(best.category), "")}
      <div class="row">${fmtClock(best.start)} – ${fmtClock(best.end)} · ${esc(best.device)}<b>${fmtDur(best.active)}</b></div>`);
  });
  svg?.addEventListener("mouseleave", () => { hovered = null; hideTip(); });
  svg?.addEventListener("click", () => { if (hovered) setFilter("app", hovered.app); });
  const used =[...new Set(segs.map((s) => s.category))];
  $("#catLegend").innerHTML = S.cats.filter((c) => used.includes(c.name))
    .map((c) => `<span><i class="sw" style="background:${catColor(c.name)}"></i>${esc(catLabel(c.name))}</span>`).join("");
}

function renderSync() {
  const now = Date.now() / 1000;
  const ago = (ts) => {
    if (!ts) return t("ago.never");
    const m = Math.round((now - ts) / 60);
    return m < 1 ? t("ago.now") : m < 60 ? t("ago.min", { n: m }) : m < 1440 ? t("ago.hour", { n: Math.round(m / 60) }) : t("ago.day", { n: Math.round(m / 1440) });
  };
  $("#sync").innerHTML = S.devices.map((d) =>
    `<span title="${t("sync.title")}"><b>${esc(d.name)}</b> sync ${ago(d.last_sync)}</span>`).join("");
}

// ---------- ritme harian: mulai, selesai, istirahat terpanjang
const clockOf = (sec) => { const m = Math.round(sec / 60) + S.dayStartHour * 60; return `${pad2(Math.floor(m / 60) % 24)}:${pad2(m % 60)}`; };
const avg = (xs) => xs.reduce((a, b) => a + b, 0) / (xs.length || 1);
const LATE_CLOCK = 22;   // aktivitas terakhir lewat jam ini = "malam larut"

function renderRhythm(st) {
  const days = st.rhythm;
  if (!days.length) {
    $("#rhTiles").innerHTML = "";
    $("#rhChart").innerHTML = `<div class="empty">${t("rh.empty")}</div>`;
    return;
  }
  const lateSec = ((LATE_CLOCK - S.dayStartHour + 24) % 24) * 3600;
  const withBreak = days.filter((d) => d.break > 0);
  const late = days.filter((d) => d.end > lateSec).length;
  const tile = (label, value, note) => `<div class="wk-tile"><div class="label">${label}</div><div class="value">${value}</div><div class="note">${note}</div></div>`;
  $("#rhTiles").innerHTML =
    tile(t("rh.start"), clockOf(avg(days.map((d) => d.start))), t("rh.earliest", { t: clockOf(Math.min(...days.map((d) => d.start))) })) +
    tile(t("rh.end"), clockOf(avg(days.map((d) => d.end))), t("rh.latest", { t: clockOf(Math.max(...days.map((d) => d.end))) })) +
    tile(t("rh.span"), fmtDur(avg(days.map((d) => d.end - d.start))), t("rh.days", { n: days.length })) +
    tile(t("rh.break"), withBreak.length ? fmtDur(avg(withBreak.map((d) => d.break))) : "–", t("rh.days", { n: withBreak.length })) +
    tile(t("rh.late"), `${late}`, t("rh.lateNote"));
  rangeChart($("#rhChart"), days, lateSec);
}

// batang mengambang: sumbu Y = jam dalam hari (atas = pagi), satu batang per hari
function rangeChart(el, days, lateSec) {
  const W = Math.max(280, el.clientWidth), H = 240, m = { l: 44, r: 8, t: 8, b: 24 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const lo = Math.max(0, Math.floor(Math.min(...days.map((d) => d.start)) / 3600) - 1) * 3600;
  const hi = Math.min(24, Math.ceil(Math.max(...days.map((d) => d.end), lateSec) / 3600) + 1) * 3600;
  const y = (sec) => m.t + ((sec - lo) / (hi - lo)) * ih;
  const band = iw / days.length, bw = Math.min(18, Math.max(3, band * 0.6));
  let g = "", marks = "", hits = "";
  const stepH = (hi - lo) / 3600 > 12 ? 3 : 2;
  for (let s = Math.ceil(lo / 3600 / stepH) * stepH * 3600; s <= hi; s += stepH * 3600) {
    g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(s)}" y2="${y(s)}" stroke="var(--grid)"/>`;
    g += `<text x="${m.l - 6}" y="${y(s) + 4}" text-anchor="end">${clockOf(s)}</text>`;
  }
  // garis acuan "malam larut"
  g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(lateSec)}" y2="${y(lateSec)}" stroke="var(--s2)" stroke-opacity=".6"/>`;
  g += `<text x="${W - m.r}" y="${y(lateSec) - 4}" text-anchor="end">${pad2(LATE_CLOCK)}:00</text>`;
  const every = Math.ceil(days.length / Math.max(1, Math.floor(iw / 46)));
  days.forEach((d, i) => {
    const cx = m.l + band * i + band / 2, x = cx - bw / 2, r = Math.min(4, bw / 2);
    const seg = (a, b) => (y(b) - y(a) > 0.5 ? `<rect x="${x}" y="${y(a)}" width="${bw}" height="${y(b) - y(a)}" rx="${r}" fill="var(--s1)"/>` : "");
    if (d.break_start != null) {
      marks += seg(d.start, d.break_start) + seg(d.break_start + d.break, d.end);
      // istirahat: garis tipis penghubung, bukan batang
      marks += `<line x1="${cx}" x2="${cx}" y1="${y(d.break_start)}" y2="${y(d.break_start + d.break)}" stroke="var(--s1)" stroke-opacity=".45" stroke-width="1.5"/>`;
    } else {
      marks += seg(d.start, d.end);
    }
    if (i % every === 0) g += `<text x="${cx}" y="${H - 6}" text-anchor="middle">${esc(periodLabel(d.day, "day", true))}</text>`;
    hits += `<rect class="hit" data-i="${i}" x="${m.l + band * i}" y="${m.t}" width="${band}" height="${ih}" fill="transparent"/>`;
  });
  el.innerHTML = `<svg width="${W}" height="${H}" role="img" aria-label="${t("rh.title")}">${g}${marks}${hits}</svg>`;
  el.querySelectorAll(".hit").forEach((h) => {
    const d = days[+h.dataset.i];
    h.addEventListener("mousemove", (ev) => {
      h.setAttribute("fill", "var(--wash)");
      showTip(ev, `<div class="tt">${esc(fmtDate(d.day, true))}</div>
        <div class="row">${t("rh.spanRow")}<b>${clockOf(d.start)} – ${clockOf(d.end)}</b></div>
        <div class="row">${t("rh.active")}<b>${fmtDur(d.active)}</b></div>
        <div class="row">${t("rh.breakRow")}<b>${d.break ? `${fmtDur(d.break)} (${clockOf(d.break_start)}–${clockOf(d.break_start + d.break)})` : t("rh.noBreak")}</b></div>`);
    });
    h.addEventListener("mouseleave", () => { h.setAttribute("fill", "transparent"); hideTip(); });
  });
}

// ---------- editor kategori (disimpan server di volume data)
const ED = { cfg: null, source: null, dirty: false };
const SLOTS = [2, 3, 4, 5, 6, 7, 8];
const escRe = (v) => v.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

async function openEditor() {
  $("#edErr").textContent = "";
  const r = await api("/api/categories/config");
  ED.cfg = JSON.parse(JSON.stringify(r.config));
  ED.cfg.work = Object.assign({ categories: [], days: [0, 1, 2, 3, 4], start_hour: 8, end_hour: 17, office_devices: [] }, ED.cfg.work || {});
  ED.source = r.source; ED.dirty = false; ED.test = null;
  renderEditor();
  $("#catDialog").showModal();
}
function ruleHtml(c, i, n) {
  const slots = SLOTS.map((sl) => `<label style="background:var(--s${sl})" title="${sl}"><input type="radio" name="slot${i}" data-i="${i}" data-f="slot" value="${sl}" ${c.slot === sl ? "checked" : ""}><i></i></label>`).join("");
  const opt = (v) => `<option value="${v}" ${c.match === v ? "selected" : ""}>${t("ed.m." + v)}</option>`;
  return `<div class="ed-rule">
    <div class="ord"><button type="button" data-act="up" data-i="${i}" ${i ? "" : "disabled"} aria-label="${t("ed.up")}">▲</button>
      <button type="button" data-act="down" data-i="${i}" ${i < n - 1 ? "" : "disabled"} aria-label="${t("ed.down")}">▼</button></div>
    <input data-i="${i}" data-f="name" value="${esc(c.name)}" maxlength="50" aria-label="${t("ed.name")}" placeholder="${t("ed.name")}">
    <input data-i="${i}" data-f="name_en" value="${esc(c.name_en || "")}" maxlength="50" aria-label="${t("ed.nameEn")}" placeholder="${t("ed.nameEn")}">
    <select data-i="${i}" data-f="match" aria-label="${t("ed.match")}">${opt("both")}${opt("app")}${opt("title")}</select>
    <button type="button" class="ed-x" data-act="del" data-i="${i}" aria-label="${t("ed.delete")}" title="${t("ed.delete")}">✕</button>
    <div class="ed-slots" style="grid-column:2/-1" role="radiogroup" aria-label="${t("ed.color")}">${slots}</div>
    <textarea data-i="${i}" data-f="regex" maxlength="4000" spellcheck="false" aria-label="Regex" placeholder="regex, mis. Code\\.exe|GitHub">${esc(c.regex || "")}</textarea>
  </div>`;
}
function renderEditor() {
  const c = ED.cfg, w = c.work, names = c.categories.map((x) => x.name);
  $("#edSource").textContent = t(ED.source === "custom" ? "ed.custom" : "ed.default");
  $("#edReset").disabled = ED.source !== "custom";
  const check = (group, val, on, label) => `<label><input type="checkbox" data-w="${group}" value="${esc(String(val))}" ${on ? "checked" : ""}>${esc(label)}</label>`;
  const hours = (f, from, to) => `<select data-wf="${f}">${Array.from({ length: to - from + 1 }, (_, k) => from + k)
    .map((h) => `<option value="${h}" ${w[f] === h ? "selected" : ""}>${pad2(h)}:00</option>`).join("")}</select>`;
  $("#edBody").innerHTML = `
    <p class="ed-help">${t("ed.help")}</p>
    <div id="edRules">${c.categories.map((r, i) => ruleHtml(r, i, c.categories.length)).join("")}</div>
    <button class="btn" type="button" data-act="add">${t("ed.add")}</button>
    <div class="ed-sec">${t("ed.work")}</div>
    <div class="ed-work">
      <span>${t("ed.workCats")}</span><div class="ed-checks">${names.map((n) => check("categories", n, w.categories.includes(n), n)).join("")}</div>
      <span>${t("ed.workDays")}</span><div class="ed-checks">${L().wkShort.map((d, k) => check("days", k, w.days.includes(k), d)).join("")}</div>
      <span>${t("ed.workHours")}</span><div style="display:flex;gap:8px;align-items:center;max-width:280px">${hours("start_hour", 0, 23)} ${t("ed.to")} ${hours("end_hour", 1, 24)}</div>
      <span>${t("ed.office")}</span><div class="ed-checks">${S.devices.map((d) => check("office_devices", d.name, w.office_devices.includes(d.name), d.name)).join("")}</div>
    </div>
    <div class="ed-sec" style="display:flex;align-items:center;gap:10px">
      <button class="btn" type="button" data-act="test">${t("ed.test")}</button></div>
    <div id="edTest">${ED.test ? testHtml(ED.test) : ""}</div>`;
}
function testHtml(r) {
  const names = ED.cfg.categories.map((c) => c.name), total = r.per_category.reduce((a, c) => a + c.sec, 0) || 1;
  const sel = (kind, val) => `<select data-add="${kind}" data-val="${esc(val)}"><option value="">${t("ed.addTo")}</option>${names.map((n) => `<option>${esc(n)}</option>`).join("")}</select>`;
  const list = (items, kind) => items.length ? `<table><tbody>${items.map((it) => `<tr><td><div class="t">${esc(kind === "app" ? it.app : it.title)}</div>
      ${kind === "title" ? `<div class="m">${esc(it.app)}</div>` : ""}</td><td class="n">${fmtDur(it.sec)}</td><td>${sel(kind, kind === "app" ? it.app : it.title)}</td></tr>`).join("")}</tbody></table>`
    : `<div class="empty">${t("ed.allDone")}</div>`;
  return `<div class="legend" style="margin:0 0 6px">${t("ed.perCat")}:</div><div class="legend" style="margin-bottom:12px">${r.per_category.map((c) =>
      `<span>${esc(catLabel(c.name))} <b>${fmtDur(c.sec)}</b> (${Math.round(c.sec / total * 100)}%)</span>`).join("")}</div>
    <div class="ed-test"><div><div class="ed-sec" style="margin-top:0">${t("ed.unApps")}</div>${list(r.uncategorized_apps, "app")}</div>
    <div><div class="ed-sec" style="margin-top:0">${t("ed.unTitles")}</div>${list(r.uncategorized_titles, "title")}</div></div>`;
}
// input: ubah model tanpa render ulang (fokus tetap)
$("#edBody").addEventListener("input", (e) => {
  const el = e.target, i = el.dataset.i, f = el.dataset.f;
  if (i != null && f) {
    const rule = ED.cfg.categories[+i];
    if (f === "slot") rule.slot = +el.value;
    else if (f === "name") {
      const old = rule.name; rule.name = el.value;
      ED.cfg.work.categories = ED.cfg.work.categories.map((n) => (n === old ? el.value : n));
    } else rule[f] = el.value;
    ED.dirty = true;
  } else if (el.dataset.w) {
    const g = el.dataset.w, val = g === "days" ? +el.value : el.value, arr = ED.cfg.work[g];
    ED.cfg.work[g] = el.checked ? [...new Set([...arr, val])] : arr.filter((x) => x !== val);
    ED.dirty = true;
  } else if (el.dataset.wf) {
    ED.cfg.work[el.dataset.wf] = +el.value; ED.dirty = true;
  }
});
$("#edBody").addEventListener("change", (e) => {
  const el = e.target;
  if (el.dataset.f === "name") renderEditor();     // perbarui daftar kategori kerja & "tambah ke"
  if (el.dataset.add && el.value) {                  // tambah item tanpa kategori ke aturan kategori terpilih
    const rule = ED.cfg.categories.find((c) => c.name === el.value); if (!rule) return;
    const part = escRe(el.dataset.val);
    rule.regex = rule.regex ? `${rule.regex}|${part}` : part;
    if (el.dataset.add === "app" && rule.match === "title") rule.match = "both";
    if (el.dataset.add === "title" && rule.match === "app") rule.match = "both";
    ED.dirty = true; runTest();
  }
});
$("#edBody").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-act]"); if (!b) return;
  const act = b.dataset.act, i = +b.dataset.i, rules = ED.cfg.categories;
  if (act === "add") rules.push({ name: t("ed.new") + " " + (rules.length + 1), name_en: "", slot: SLOTS[rules.length % SLOTS.length], match: "both", regex: "" });
  else if (act === "del") {
    const [gone] = rules.splice(i, 1);
    ED.cfg.work.categories = ED.cfg.work.categories.filter((n) => n !== gone.name);
  } else if (act === "up" && i > 0) [rules[i - 1], rules[i]] = [rules[i], rules[i - 1]];
  else if (act === "down" && i < rules.length - 1) [rules[i + 1], rules[i]] = [rules[i], rules[i + 1]];
  else if (act === "test") return runTest();
  ED.dirty = true; renderEditor();
});
async function sendConfig(method, path, body) {
  const r = await fetch(location.origin + path, {
    method, credentials: "same-origin", headers: { "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined,
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(typeof d.detail === "string" ? d.detail
    : (d.detail || []).map((x) => `${(x.loc || []).slice(1).join(".")}: ${x.msg}`).join("; ") || `HTTP ${r.status}`);
  return d;
}
async function runTest() {
  $("#edErr").textContent = "";
  $("#edTest").innerHTML = `<div class="empty">${t("ed.testing")}</div>`;
  try { ED.test = await sendConfig("POST", "/api/categories/preview?days=30", ED.cfg); renderEditor(); }
  catch (e) { $("#edTest").innerHTML = ""; $("#edErr").textContent = e.message; }
}
async function afterConfigChange() {
  S.cats = await api("/api/categories");
  $("#catDialog").close(); load();
}
$("#edSave").addEventListener("click", async () => {
  const b = $("#edSave"); b.disabled = true; b.textContent = t("ed.saving"); $("#edErr").textContent = "";
  try { await sendConfig("PUT", "/api/categories/config", ED.cfg); ED.dirty = false; await afterConfigChange(); }
  catch (e) { $("#edErr").textContent = e.message; }
  b.disabled = false; b.textContent = t("ed.save");
});
$("#edReset").addEventListener("click", async () => {
  if (!confirm(t("ed.resetConfirm"))) return;
  try { await sendConfig("DELETE", "/api/categories/config"); ED.dirty = false; await afterConfigChange(); }
  catch (e) { $("#edErr").textContent = e.message; }
});
const closeEditor = () => { if (!ED.dirty || confirm(t("ed.unsaved"))) { ED.dirty = false; $("#catDialog").close(); } };
$("#edCancel").addEventListener("click", closeEditor);
$("#edClose").addEventListener("click", closeEditor);
$("#catDialog").addEventListener("cancel", (e) => { e.preventDefault(); closeEditor(); });   // tombol Esc
$("#catEditBtn").addEventListener("click", () => openEditor().catch((e) => alert(e.message)));

// ---------- PWA: service worker (hanya aset statis & halaman offline yang di-cache)
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));

// ---------- load
let loadSeq = 0;
async function load() {
  const seq = ++loadSeq;
  writeHash(); renderControls();
  const qs = new URLSearchParams({ from: S.from, to: S.to, group: S.group, top: 15 });
  if (S.hidden.size) qs.set("devices", visibleDevices().join(","));
  addFilterParams(qs);
  try {
    const st = await api("/api/stats?" + qs);
    if (seq !== loadSeq) return;
    S.stats = st; $("#error").classList.add("hidden");
    renderAll(st);
    if (!S.tlDay || S.tlDay < S.from || S.tlDay > S.to) S.tlDay = S.to;
    await loadTimeline();
  } catch (e) {
    $("#error").textContent = t("loadFail") + e.message; $("#error").classList.remove("hidden");
  }
}
async function loadTimeline() {
  writeHash();
  const qs = new URLSearchParams({ day: S.tlDay });
  if (S.hidden.size) qs.set("devices", visibleDevices().join(","));
  addFilterParams(qs);
  S.tl = await api("/api/timeline?" + qs);
  renderTimeline();
}

async function init() {
  const [cfg, devices, cats] = await Promise.all([api("/api/config"), api("/api/devices"), api("/api/categories")]);
  S.today = cfg.today; S.tz = cfg.tz; S.dayStartHour = cfg.day_start_hour; S.cfg = cfg;
  S.devices = devices; S.cats = cats;
  readHash();
  S.hidden = new Set([...S.hidden].filter((h) => devices.some((d) => d.name === h)));
  if (!S.from) { [S.from, S.to] = presetRange(S.preset, S.today); S.group = autoGroup(S.from, S.to); }
  renderSync();
  await load();
}
let rz;
addEventListener("resize", () => {
  clearTimeout(rz);
  rz = setTimeout(() => { if (S.stats) renderAll(S.stats); if (S.tl) renderTimeline(); }, 150);
});
init().catch((e) => { $("#error").textContent = t("loadFail") + e.message; $("#error").classList.remove("hidden"); });
</script>
