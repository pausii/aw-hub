<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Offline · AW Hub</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root { color-scheme: light dark; --page: #f4f3ef; --ink: #0b0b0b; --ink-2: #52514e; --accent: #2a78d6; }
@media (prefers-color-scheme: dark) { :root { --page: #0d0d0d; --ink: #ffffff; --ink-2: #c3c2b7; --accent: #3987e5; } }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--page); color: var(--ink);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
img { width: 72px; height: 72px; }
h1 { font-size: 22px; margin: 16px 0 6px; }
p { color: var(--ink-2); margin: 0 0 4px; }
a { display: inline-block; margin-top: 20px; color: #fff; background: var(--accent); padding: 10px 20px;
  border-radius: 10px; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>AW Hub needs a connection to load your data.</p>
    <p>Kamu sedang offline — AW Hub butuh koneksi untuk memuat data.</p>
    <a href="/">Try again · Coba lagi</a>
  </main>
</body>
</html>
