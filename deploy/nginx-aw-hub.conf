# Vhost nginx untuk AW Hub di belakang Cloudflare (proxied).
# Salin ke /etc/nginx/sites-available/<domain>, ganti server_name & path sertifikat,
# lalu symlink ke sites-enabled dan `nginx -t && systemctl reload nginx`.
#
# Port 80 sengaja TIDAK di-redirect ke HTTPS: dengan SSL mode Cloudflare "Flexible",
# Cloudflare→origin memakai HTTP, dan redirect di origin akan jadi loop.
# HTTPS ke pengguna tetap dijamin Cloudflare ("Always Use HTTPS").
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name aw.example.com;   # ganti dengan domain kamu

    # self-signed origin cert (cukup untuk mode "Full"); ganti dengan
    # Cloudflare Origin Certificate bila mode "Full (strict)".
    ssl_certificate     /etc/ssl/aw-hub/cert.pem;
    ssl_certificate_key /etc/ssl/aw-hub/key.pem;

    # Hanya Cloudflare yang boleh masuk (akses langsung ke IP origin ditolak 403), sehingga
    # header CF-Connecting-IP yang dipakai pembatas login tidak bisa dipalsukan.
    # Buat/perbarui dengan deploy/update-cloudflare-ips.sh.
    include /etc/nginx/snippets/cloudflare-only.conf;
    server_tokens off;

    client_max_body_size 50M;   # kiriman agent per hari bisa beberapa MB
    access_log /var/log/nginx/aw-hub-access.log;
    error_log  /var/log/nginx/aw-hub-error.log;

    location / {
        proxy_pass http://127.0.0.1:8077;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
}
