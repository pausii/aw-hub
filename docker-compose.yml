services:
  app:
    build: ./server
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
      - ./config:/config:ro   # edit config/categories.json → langsung terbaca, tanpa restart
    # hanya localhost: diakses lewat reverse proxy (nginx host, atau caddy di bawah)
    ports:
      - "127.0.0.1:${AW_HUB_PORT:-8077}:8000"

  # Opsional — HTTPS otomatis (Let's Encrypt) bila port 80/443 server masih kosong:
  #   docker compose --profile caddy up -d
  caddy:
    image: caddy:2
    profiles: ["caddy"]
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
